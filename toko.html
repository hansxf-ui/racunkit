<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Rekomendasi — RacunKit</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <a class="back" href="index.html">← Beranda</a>
    <header class="top">
        <h1>🏪 Toko Rekomendasi</h1>
        <p>Produk-produk pilihan yang worth it menurut gue. Klik tombolnya buat beli di Shopee.</p>
    </header>

    <div class="chips" id="chips"></div>
    <div class="prod-grid" id="grid"></div>
    <p class="empty" id="empty" style="display:none">Belum ada produk — tambah via <a href="toko-admin.html">admin</a>.</p>

    <footer class="foot"><a href="toko-admin.html">Kelola produk</a></footer>
</div>

<script src="js/common.js"></script>
<script src="js/toko-store.js"></script>
<script src="js/toko-render.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
let cur = 'Semua';

const render = () => {
    const products = getProducts();
    const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
    $('chips').innerHTML = ['Semua', ...cats].map(c =>
        `<button class="${c === cur ? 'on' : ''}" data-f="${esc(c)}">${esc(c)}</button>`).join('');
    const list = cur === 'Semua' ? products : products.filter(p => p.category === cur);
    $('grid').innerHTML = list.map(renderCard).join('');
    $('empty').style.display = products.length ? 'none' : 'block';
};

document.addEventListener('click', (e) => {
    const chip = e.target.closest('[data-f]');
    if (chip) { cur = chip.dataset.f; render(); return; }
    const buy = e.target.closest('[data-toko-id]');
    if (buy) trackClick(buy.dataset.tokoId);
});

render();
</script>
</body>
</html>
